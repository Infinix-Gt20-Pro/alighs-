name: Security Scan & Pentest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  code-security-audit:
    name: Code & Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Lint Check
        run: npm run build

  strix-pentest:
    name: Strix AI Penetration Test
    runs-on: ubuntu-latest
    needs: code-security-audit
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix CLI
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            strix -n -t ./ --scan-mode quick --max-budget 10
          else
            echo "STRIX_LLM or LLM_API_KEY not configured in GitHub Secrets yet. Skipping live AI pentest execution."
          fi
